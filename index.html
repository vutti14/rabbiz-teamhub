/* ─── GUN HOOKS ─── */
function useGunSet(path){
  const [items,setItems]=useState([]);
  const gen=useRef(0);
  useEffect(()=>{
    const myGen=++gen.current;
    const store={};
    window.DB.get(path).map().on((data,key)=>{
      if(gen.current!==myGen||!data||key==='_'||typeof data!=='object')return;
      if(data._d)delete store[key];
      else store[key]={...data,_k:key};
      setItems(Object.values(store).filter(x=>x&&!x._d).sort((a,b)=>(a.ts||0)-(b.ts||0)));
    });
  },[path]);
  return items;
}

function useGunTeam(){
  const [team,setTeam]=useState(SEED_TEAM);
  const store=useRef({});
  useEffect(()=>{
    window.DB.get('team').map().on((data,key)=>{
      if(!data||key==='_'||typeof data!=='object')return;
      if(data._d)delete store.current[key];
      else store.current[key]={...data};
      const arr=Object.values(store.current)
        .filter(x=>x&&x.id&&!x._d)
        .sort((a,b)=>a.id-b.id);
      if(arr.length>0)setTeam(arr);
    });
  },[]);
  return team;
}

function useGunProjects(){
  const [projects,setProjects]=useState(SEED_PROJECTS);
  const store=useRef({});
  useEffect(()=>{
    window.DB.get('projects').map().on((data,key)=>{
      if(!data||key==='_'||typeof data!=='object')return;
      if(data._d)delete store.current[key];
      else store.current[key]={...data,_k:key};

      if(arr.length>0)setProjects(arr);
    });
  },[]);
  return projects;
}

/* ─── SEED DATA ─── */
function seedIfNeeded(){
  const key='rz_seeded_'+ROOM_KEY;
  if(localStorage.getItem(key))return;
  SEED_TEAM.forEach(m=>window.DB.get('team').get(String(m.id)).put({...m}));
  SEED_TASKS.forEach(t=>window.DB.get('tasks').get(t.id).put({...t}));
  SEED_PROJECTS.forEach(p=>window.DB.get('projects').get(p.id).put({...p}));
  SEED_MSGS.forEach(m=>{const {proj,...msg}=m;window.DB.get('msgs').get(proj).set({...msg});});
  localStorage.setItem(key,'1');
}

/* ─── PDF ─── */
function genPDF(r,projects=SEED_PROJECTS){
  const{jsPDF}=window.jspdf;const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
  const W=210,M=15,CW=W-M*2;let y=M;
  const proj=projects.find(p=>p.id===r.project)||{name:r.project};
  const sub=r.submitter||{};const rd=ROLES[sub.role]||{label:"-"};
  doc.setFillColor(9,14,26);doc.rect(0,0,W,30,"F");doc.setFillColor(20,32,51);doc.rect(0,24,W,6,"F");
  doc.setFont("helvetica","bold");doc.setFontSize(18);doc.setTextColor(245,158,11);doc.text("RABBiZ",M,13);
  doc.setFontSize(9);doc.setFont("helvetica","normal");doc.setTextColor(148,163,184);doc.text("TeamHub — Work Report",M,19);
  doc.setTextColor(100,116,139);doc.setFontSize(8);doc.text(new Date().toLocaleString("th-TH"),W-M,19,"right");y=36;
  doc.setFillColor(20,32,51);doc.roundedRect(M,y,CW,16,3,3,"F");
  doc.setFontSize(8);doc.setFont("helvetica","bold");doc.setTextColor(100,116,139);doc.text(proj.name.toUpperCase(),M+5,y+6);
  doc.setFontSize(13);doc.setTextColor(226,232,240);doc.text(r.title||"รายงาน",M+5,y+13);y+=22;
  const pct=Math.min(100,Math.max(0,r.progress||0));const pc=pct>=100?[16,185,129]:pct>=50?[245,158,11]:[239,68,68];
  doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(100,116,139);doc.text("ความคืบหน้า",M,y);
  doc.setFont("helvetica","bold");doc.setTextColor(...pc);doc.text(`${pct}%`,W-M,y,"right");y+=4;
  doc.setFillColor(26,40,64);doc.roundedRect(M,y,CW,4,2,2,"F");
  if(pct>0){doc.setFillColor(...pc);doc.roundedRect(M,y,CW*(pct/100),4,2,2,"F");}y+=10;
  doc.autoTable({startY:y,head:[["ข้อมูล","รายละเอียด"]],body:[
    ["ผู้ส่งงาน",`${sub.name||"-"} ${sub.surname||""}`.trim()],
    ["แผนก",`${sub.dept||"-"} (${rd.label})`],["โทร",sub.phone||"-"],
    ["โปรเจกต์",proj.name],["สถานะ",`${pct}%`],["วันที่",r.time||"-"],
  ],margin:{left:M,right:M},styles:{font:"helvetica",fontSize:8.5,textColor:[200,210,225],fillColor:[15,26,46],lineColor:[26,40,64],lineWidth:.3},headStyles:{fillColor:[20,32,51],textColor:[245,158,11],fontStyle:"bold",fontSize:8},alternateRowStyles:{fillColor:[13,22,40]},columnStyles:{0:{cellWidth:40,fontStyle:"bold",textColor:[100,116,139]}}});
  y=doc.lastAutoTable.finalY+8;
  if(r.detail){doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(245,158,11);doc.text("รายละเอียด",M,y);y+=5;doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(200,210,225);const lines=doc.splitTextToSize(r.detail,CW);doc.text(lines,M,y);y+=lines.length*4.5+6;}
  if(r.photos&&r.photos.length>0){if(y>220){doc.addPage();y=20;}doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(245,158,11);doc.text(`รูปภาพ (${r.photos.length})`,M,y);y+=6;const iw=57,ih=44,gap=5.5;let cx=M;r.photos.forEach((src,i)=>{if(cx+iw>W-M){cx=M;y+=ih+8;}if(y+ih>285){doc.addPage();y=20;cx=M;}try{doc.addImage(src,src.startsWith("data:image/png")?"PNG":"JPEG",cx,y,iw,ih);doc.setDrawColor(26,40,64);doc.rect(cx,y,iw,ih,"S");doc.setFont("helvetica","normal");doc.setFontSize(6.5);doc.setTextColor(100,116,139);doc.text(`${i+1}`,cx+2,y+ih+3.5);}catch(e){}cx+=iw+gap;});if(cx>M)y+=ih+10;}
  const n=doc.internal.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFillColor(9,14,26);doc.rect(0,285,W,12,"F");doc.setFont("helvetica","normal");doc.setFontSize(7);doc.setTextColor(64,90,116);doc.text("RABBiZ Group — Confidential",M,291);doc.text(`หน้า ${i}/${n}`,W-M,291,"right");}
  doc.save(`RABBiZ_Report_${Date.now()}.pdf`);
}

/* ─── MENTION PARSER: render @name as colored highlight ─── */
function parseMention(text,team){
  if(!text||!text.includes('@'))return text;
  const parts=text.split(/(@[a-zA-Z0-9\u0E00-\u0E7F\s]{1,30})/g);
  return parts.map((p,i)=>{
    if(!p.startsWith('@'))return p;
    const name=p.slice(1);
    const m=team.find(x=>x.name===name||`${x.name}${x.surname}`===name||(x.name+' '+x.surname).trim()===name);
    if(!m)return p;
    return<span key={i} style={{background:`${m.color}25`,color:m.color,borderRadius:5,padding:"0 4px",fontWeight:600}}>{p}</span>;
  });
}

  useEffect(()=>{botRef.current?.scrollIntoView({behavior:"smooth"});},[msgs.length,proj]);

  // Detect @ as user types
  const handleInput=(e)=>{
    const val=e.target.value;
    setInput(val);
    const cursor=e.target.selectionStart;
    const before=val.slice(0,cursor);
    const m=before.match(/@([\w\u0E00-\u0E7F\s]{0,30})$/);
    setMentionQ(m?m[1]:null);
  };

  const insertMention=(member)=>{
    const cursor=inputRef.current.selectionStart;

    const after=input.slice(cursor);

    </div>
    {commentTask&&<TaskCommentModal task={commentTask} me={me} team={team} onClose={()=>setCommentTask(null)}/>}

  );
}

function SubmitView({me,team,tasks,toast,projects}){
  const subs=useGunSet('subs');

  const [isDrag,setIsDrag]=useState(false);
  const [busy,setBusy]=useState(false);
  const fileRef=useRef();

  const handleFiles=useCallback((files)=>{
    const arr=Array.from(files).filter(f=>f.type.startsWith("image/"));
    const rem=8-sub.photos.length;
    if(rem<=0){toast("รูปเต็มแล้ว 8 รูปต่อรายงาน",true);return;}
    arr.slice(0,rem).forEach(f=>{const r=new FileReader();r.onload=e=>setSub(p=>({...p,photos:[...p.photos,{src:e.target.result,name:f.name,size:Math.round(f.size/1024)+"KB"}]}));r.readAsDataURL(f);});
  },[sub.photos.length,toast]);

  const submit=async()=>{
    if(!sub.title.trim()){toast("กรุณาใส่ชื่องาน",true);return;}
    setBusy(true);
    const report={
      uid:me.id,
      submitter:{id:me.id,name:me.name,surname:me.surname||"",dept:me.dept,role:me.role,phone:me.phone||""},
      title:sub.title,project:sub.project,taskId:sub.taskId,progress:sub.progress,
      detail:sub.detail,photos:sub.photos.map(p=>p.src),
      time:new Date().toLocaleString("th-TH"),ts:Date.now()
    };
    window.DB.get('subs').set(report);
    if(sub.taskId&&sub.progress>=100){
      const task=tasks.find(t=>t._k===sub.taskId);
      if(task)window.DB.get('tasks').get(task._k).put((({_k,...t})=>({...t,status:"review"}))(task));
    }
    setSub({title:"",project:"nara",taskId:"",progress:50,detail:"",photos:[]});
    setBusy(false);toast("ส่งรายงานสำเร็จ ✓");
  };

  const pc=sub.progress>=100?C.green:sub.progress>=50?C.amber:C.red;
  const pt=tasks.filter(t=>t.project===sub.project&&t.status!=="done");

  return(
    <div style={{flex:1,overflow:"auto",padding:20}}>
      <div style={{maxWidth:640,margin:"0 auto"}}>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
            <div><Lbl>โปรเจกต์</Lbl><Sel value={sub.project} onChange={e=>setSub({...sub,project:e.target.value,taskId:""})}>{projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</Sel></div>
            <div><Lbl>งานที่เกี่ยวข้อง</Lbl><Sel value={sub.taskId} onChange={e=>setSub({...sub,taskId:e.target.value})}><option value="">-- เลือก (ถ้ามี) --</option>{pt.map(t=><option key={t._k} value={t._k}>{t.title}</option>)}</Sel></div>
          </div>
          <Lbl>ความคืบหน้า — {sub.progress}%</Lbl>
          <input type="range" min={0} max={100} step={5} value={sub.progress} onChange={e=>setSub({...sub,progress:parseInt(e.target.value)})} style={{width:"100%",accentColor:pc,marginBottom:4}}/>
          <div style={{height:6,background:C.bg3,borderRadius:99,marginBottom:12,overflow:"hidden"}}><div style={{height:"100%",width:`${sub.progress}%`,background:pc,borderRadius:99,transition:"width .3s"}}/></div>
          <Lbl>รายละเอียดงาน</Lbl>
          <TA value={sub.detail} onChange={e=>setSub({...sub,detail:e.target.value})} placeholder="อธิบายสิ่งที่ทำ ปัญหาที่พบ สิ่งที่ต้องดำเนินการต่อ..." style={{marginBottom:12}}/>
          <Lbl>รูปภาพหน้างาน ({sub.photos.length}/8)</Lbl>
          <input ref={fileRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={e=>handleFiles(e.target.files)}/>
          <div onDragOver={e=>{e.preventDefault();setIsDrag(true);}} onDragLeave={()=>setIsDrag(false)} onDrop={e=>{e.preventDefault();setIsDrag(false);handleFiles(e.dataTransfer.files);}} onClick={()=>fileRef.current?.click()}
            style={{background:isDrag?C.amberBg:C.bg3,border:`2px dashed ${isDrag?C.amber:C.bdL}`,borderRadius:11,padding:"15px",textAlign:"center",cursor:"pointer",transition:"all .2s",marginBottom:sub.photos.length?10:14}}>

            <div key={i} style={{position:"relative",aspectRatio:"1",borderRadius:8,overflow:"hidden",border:`1px solid ${C.bdL}`}}>
              <img src={ph.src} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
              <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.45)",opacity:0,transition:"opacity .15s",display:"flex",alignItems:"center",justifyContent:"center"}} onMouseEnter={e=>e.currentTarget.style.opacity=1} onMouseLeave={e=>e.currentTarget.style.opacity=0}>
                <button onClick={e=>{e.stopPropagation();setSub(p=>({...p,photos:p.photos.filter((_,j)=>j!==i)}));}} style={{background:C.red,border:"none",borderRadius:"50%",width:24,height:24,color:"#fff",cursor:"pointer",fontSize:13}}>✕</button>
              </div>

            {busy?<><Spin/>กำลังส่ง...</>:"ส่งรายงาน →"}
          </button>
        </Card>

        {/* History */}
        {subs.length>0&&<div>

              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:13.5,marginBottom:3}}>{s.title}</div>
                  <div style={{fontSize:11.5,color:C.textM,marginBottom:s.detail?5:0}}>
                    {projects.find(p=>p.id===s.project)?.name} · <span style={{color:s.progress>=100?C.green:C.amber,fontWeight:700}}>{s.progress}%</span>
                    {s.submitter?.name&&<span> · {s.submitter.name}</span>} · {s.time}
                  </div>

                  {s.photos?.length>0&&<div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{s.photos.slice(0,6).map((src,i)=><img key={i} src={src} alt="" style={{width:42,height:42,objectFit:"cover",borderRadius:6,border:`1px solid ${C.bdL}`}}/>)}{s.photos.length>6&&<div style={{width:42,height:42,background:C.bg3,borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:C.textM}}>+{s.photos.length-6}</div>}</div>}
                </div>

                  <Chip label="ส่งแล้ว ✓" color={C.green} bg={C.greenBg}/>
                  <button onClick={()=>genPDF(s,projects)} style={{background:C.bg3,border:`1px solid ${C.bdL}`,borderRadius:8,padding:"5px 12px",cursor:"pointer",color:C.textS,fontSize:12,fontFamily:"inherit"}} onMouseEnter={e=>{e.currentTarget.style.borderColor=C.amber;e.currentTarget.style.color=C.amber;}} onMouseLeave={e=>{e.currentTarget.style.borderColor=C.bdL;e.currentTarget.style.color=C.textS;}}>📄 PDF</button>
                </div>
              </div>
            </Card>
          ))}
        </div>}
      </div>
    </div>
  );
}

          </div>

            <Card key={i} style={{padding:"12px 16px"}}><div style={{fontSize:24,fontWeight:700,color:s.c,lineHeight:1}}>{s.v}</div><div style={{fontSize:11,color:C.textM,marginTop:4}}>{s.l}</div></Card>

        </div>

        <div style={{display:"flex",gap:8,marginBottom:12,alignItems:"center"}}>
          <Sel value={frole} onChange={e=>setFrole(e.target.value)} style={{width:150}}><option value="all">ทุก Role</option>{Object.entries(ROLES).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}</Sel>

        </div>

        {/* Add form */}
        {showAdd&&<Card style={{padding:"16px 18px",marginBottom:14,border:`1px solid ${C.amber}40`,background:C.amberBg}}>
          <div style={{fontSize:13,fontWeight:700,color:C.amber,marginBottom:12}}>✚ เพิ่มสมาชิกใหม่</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:8}}>
            <div><Lbl>ชื่อ *</Lbl><Inp value={newM.name} onChange={e=>setNewM({...newM,name:e.target.value})} placeholder="ชื่อ"/></div>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr auto",gap:8}}>

            <div><Lbl>เบอร์โทร</Lbl><Inp value={newM.phone} onChange={e=>setNewM({...newM,phone:e.target.value})} placeholder="08X-XXX"/></div>

          </div>
          {newM.name&&<div style={{marginTop:10,background:C.bg3,border:`1px solid ${C.bdL}`,borderRadius:8,padding:"8px 12px",display:"flex",alignItems:"center",gap:10}}><Av initials={newM.initials||(newM.name[0]+(newM.surname[0]||""))} color={newM.color} size={30}/><span style={{fontSize:13}}>{newM.name} {newM.surname} — {newM.dept}</span><Chip label={ROLES[newM.role]?.label} color={ROLES[newM.role]?.color} bg={ROLES[newM.role]?.bg}/></div>}

              if(!newM.name.trim()||!newM.dept.trim()){toast("กรอกชื่อและแผนกด้วยครับ",true);return;}
              const id=Date.now();const ini=newM.initials||(newM.name[0]+(newM.surname[0]||""));
              saveM({id,...newM,initials:ini,active:true});
              setNewM({name:"",surname:"",role:"engineer",dept:"",initials:"",color:"#3b82f6",phone:"",pin:""});

            }}>บันทึก</PBtn>
            <GBtn onClick={()=>setShowAdd(false)}>ยกเลิก</GBtn>
          </div>

        {/* Edit form */}
        {editing&&<Card style={{padding:"16px 18px",marginBottom:14,border:`1px solid ${C.blue}40`,background:C.blueBg}}>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:8,marginBottom:8}}>

            <div><Lbl>นามสกุล</Lbl><Inp value={editing.surname||""} onChange={e=>setEditing({...editing,surname:e.target.value})}/></div>
            <div><Lbl>แผนก</Lbl><Inp value={editing.dept} onChange={e=>setEditing({...editing,dept:e.target.value})}/></div>

          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr auto",gap:8}}>
            <div><Lbl>Role</Lbl><Sel value={editing.role} onChange={e=>setEditing({...editing,role:e.target.value})}>{Object.entries(ROLES).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}</Sel></div>
            <div><Lbl>ชื่อย่อ</Lbl><Inp value={editing.initials} maxLength={3} onChange={e=>setEditing({...editing,initials:e.target.value})}/></div>
            <div><Lbl>PIN ใหม่</Lbl><Inp type="password" placeholder="ปล่อยว่าง=ไม่เปลี่ยน" maxLength={4} value={editing._np||""} onChange={e=>setEditing({...editing,_np:e.target.value})}/></div>
            <div style={{display:"flex",flexDirection:"column",gap:4}}><Lbl>สี</Lbl><input type="color" value={editing.color} onChange={e=>setEditing({...editing,color:e.target.value})} style={{width:40,height:36,border:`1px solid ${C.bdL}`,borderRadius:8,cursor:"pointer",background:"transparent"}}/></div>
          </div>
          <div style={{marginTop:12,display:"flex",gap:8}}>
            <PBtn onClick={()=>{const m={...editing};if(m._np){m.pin=m._np;delete m._np;}saveM(m);setEditing(null);toast("บันทึกแล้ว ✓");}}>บันทึก</PBtn>

          </div>
        </Card>}

        {/* Member list */}
        <div style={{display:"flex",flexDirection:"column",gap:9}}>
          {filt.map(m=>{
            if(!m||m._d)return null;
            const rd=ROLES[m.role]||ROLES.viewer;

            const sc=subs.filter(s=>s.uid===m.id).length;

              <Card key={m.id} style={{padding:"14px 16px",opacity:m.active?1:.5,transition:"opacity .2s"}}>

                  <Av initials={m.initials} color={m.color} size={44} dot={m.active?"on":"off"}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap",marginBottom:3}}><span style={{fontWeight:700,fontSize:14}}>{m.name} {m.surname}</span><Chip label={rd.label} color={rd.color} bg={rd.bg}/>{!m.active&&<Chip label="ปิดใช้งาน" color={C.textM} bg={C.bg4}/>}</div>
                    <div style={{fontSize:12,color:C.textM}}>{m.dept}{m.phone&&` · ${m.phone}`}</div>
                  </div>
                  <div style={{display:"flex",gap:14}}>
                    {[{v:tc,l:"งานค้าง",c:tc>0?C.amber:C.textM},{v:sc,l:"รายงาน",c:C.green}].map((s,i)=><div key={i} style={{textAlign:"center"}}><div style={{fontSize:18,fontWeight:700,color:s.c,lineHeight:1}}>{s.v}</div><div style={{fontSize:9,color:C.textM,marginTop:2}}>{s.l}</div></div>)}
                  </div>
                  <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                    <button onClick={()=>setPermM(m.id)} style={{background:C.bg3,border:`1px solid ${C.bdL}`,borderRadius:7,padding:"5px 8px",cursor:"pointer",fontSize:12,color:C.textS,fontFamily:"inherit"}}>🔐</button>
                    <button onClick={()=>setEditing({...m})} style={{background:C.bg3,border:`1px solid ${C.bdL}`,borderRadius:7,padding:"5px 8px",cursor:"pointer",fontSize:12,color:C.textS,fontFamily:"inherit"}}>✏️</button>
                    <button onClick={()=>toggleM(m)} style={{background:m.active?C.greenBg:C.redBg,border:`1px solid ${m.active?"rgba(16,185,129,.25)":"rgba(239,68,68,.25)"}`,borderRadius:7,padding:"5px 8px",cursor:"pointer",fontSize:12,color:m.active?C.green:C.red,fontFamily:"inherit"}}>{m.active?"✓ ใช้งาน":"✗ ปิด"}</button>
                    <DBtn onClick={()=>setConfDel(m.id)}>🗑</DBtn>
                  </div>
                </div>
                <div style={{marginTop:9,display:"flex",gap:5,flexWrap:"wrap"}}>{ALLP.map(([pk,pl])=>{const has=rd.perms.includes(pk);return<span key={pk} style={{fontSize:10.5,padding:"2px 9px",borderRadius:99,background:has?C.greenBg:C.bg3,color:has?C.green:C.textM,border:`1px solid ${has?"rgba(16,185,129,.2)":C.bdL}`}}>{pl}</span>;})}</div>
              </Card>
            );
          })}
        </div>

        {/* ── PROJECTS SECTION ── */}
        <div style={{marginTop:28}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
            <div>
              <div style={{fontSize:15,fontWeight:700}}>📁 จัดการโปรเจกต์</div>
              <div style={{fontSize:12,color:C.textM,marginTop:2}}>เพิ่ม ลบ แก้ไขชื่อ icon และสีของแต่ละโปรเจกต์</div>
            </div>
            <PBtn onClick={()=>setShowAddP(true)}>+ โปรเจกต์ใหม่</PBtn>
          </div>

          {/* Add project form */}
          {showAddP&&<Card style={{padding:"16px 18px",marginBottom:14,border:`1px solid ${C.amber}40`,background:C.amberBg}}>
            <div style={{fontSize:13,fontWeight:700,color:C.amber,marginBottom:12}}>✚ โปรเจกต์ใหม่</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr auto auto",gap:10,alignItems:"end",marginBottom:12}}>
              <div><Lbl>ชื่อโปรเจกต์ *</Lbl><Inp value={newP.name} onChange={e=>setNewP({...newP,name:e.target.value})} placeholder="เช่น คอนโด อ่อนนุช, Satoshi Tower"/></div>
              <div><Lbl>สี</Lbl><input type="color" value={newP.color} onChange={e=>setNewP({...newP,color:e.target.value})} style={{width:44,height:38,border:`1px solid ${C.bdL}`,borderRadius:8,cursor:"pointer",background:"transparent"}}/></div>
              <div style={{paddingBottom:0}}>
                {newP.name&&<div style={{height:38,paddingLeft:12,paddingRight:12,borderRadius:9,background:`${newP.color}20`,border:`1px solid ${newP.color}60`,display:"flex",alignItems:"center",gap:7,fontSize:13,fontWeight:600,color:newP.color,whiteSpace:"nowrap"}}>{newP.icon} {newP.name}</div>}
              </div>
            </div>
            <Lbl>เลือก Icon</Lbl>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
              {ICONS.map(ic=><button key={ic} onClick={()=>setNewP({...newP,icon:ic})} style={{width:36,height:36,borderRadius:8,border:`2px solid ${newP.icon===ic?C.amber:C.bdL}`,background:newP.icon===ic?C.amberBg:C.bg3,fontSize:18,cursor:"pointer",transition:"all .15s"}}>{ic}</button>)}
            </div>
            <div style={{display:"flex",gap:8}}><PBtn onClick={addP}>บันทึก</PBtn><GBtn onClick={()=>setShowAddP(false)}>ยกเลิก</GBtn></div>
          </Card>}

          {/* Edit project form */}
          {editingP&&<Card style={{padding:"16px 18px",marginBottom:14,border:`1px solid ${C.blue}40`,background:C.blueBg}}>
            <div style={{fontSize:13,fontWeight:700,color:C.blue,marginBottom:12}}>✏️ แก้ไขโปรเจกต์</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr auto",gap:10,alignItems:"end",marginBottom:12}}>
              <div><Lbl>ชื่อโปรเจกต์</Lbl><Inp value={editingP.name} onChange={e=>setEditingP({...editingP,name:e.target.value})}/></div>
              <div><Lbl>สี</Lbl><input type="color" value={editingP.color} onChange={e=>setEditingP({...editingP,color:e.target.value})} style={{width:44,height:38,border:`1px solid ${C.bdL}`,borderRadius:8,cursor:"pointer",background:"transparent"}}/></div>
            </div>
            <Lbl>เลือก Icon</Lbl>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
              {ICONS.map(ic=><button key={ic} onClick={()=>setEditingP({...editingP,icon:ic})} style={{width:36,height:36,borderRadius:8,border:`2px solid ${editingP.icon===ic?C.amber:C.bdL}`,background:editingP.icon===ic?C.amberBg:C.bg3,fontSize:18,cursor:"pointer",transition:"all .15s"}}>{ic}</button>)}
            </div>
            <div style={{display:"flex",gap:8}}>
              <PBtn onClick={()=>{saveP(editingP);setEditingP(null);toast("บันทึกโปรเจกต์แล้ว ✓");}}>บันทึก</PBtn>
              <GBtn onClick={()=>setEditingP(null)}>ยกเลิก</GBtn>
            </div>
          </Card>}

          {/* Confirm delete project */}
          {confDelP&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center"}}>
            <Card style={{padding:26,width:340,textAlign:"center",animation:"fadeUp .2s ease"}}>
              <div style={{fontSize:34,marginBottom:10}}>⚠️</div>
              <div style={{fontWeight:700,fontSize:15,marginBottom:8}}>ลบโปรเจกต์?</div>
              <div style={{fontSize:13,color:C.textM,marginBottom:6}}>ลบ <b style={{color:C.text}}>{confDelP.icon} {confDelP.name}</b></div>
              <div style={{fontSize:12,color:C.red,marginBottom:20}}>งานที่ผูกกับโปรเจกต์นี้จะยังอยู่ในระบบ แต่จะไม่แสดงใน Project tab</div>
              <div style={{display:"flex",gap:10,justifyContent:"center"}}><GBtn onClick={()=>setConfDelP(null)}>ยกเลิก</GBtn><DBtn onClick={()=>{delP(confDelP);setConfDelP(null);toast("ลบโปรเจกต์แล้ว");}}>ลบออก</DBtn></div>
            </Card>
          </div>}

          {/* Project list */}
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {projects.map(p=>{
              const ptc=tasks.filter(t=>t.project===p.id&&t.status!=="done").length;
              const ptotal=tasks.filter(t=>t.project===p.id).length;
              return(
                <Card key={p._k||p.id} style={{padding:"14px 16px"}}>
                  <div style={{display:"flex",alignItems:"center",gap:12}}>
                    <div style={{width:44,height:44,borderRadius:12,background:`${p.color}20`,border:`2px solid ${p.color}50`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{p.icon}</div>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:700,fontSize:14,color:p.color}}>{p.name}</div>
                      <div style={{fontSize:12,color:C.textM,marginTop:2}}>
                        งานทั้งหมด {ptotal} · ค้างดำเนินการ <span style={{color:ptc>0?C.amber:C.green,fontWeight:600}}>{ptc}</span>
                      </div>
                    </div>
                    <div style={{display:"flex",gap:5}}>
                      <button onClick={()=>setEditingP({...p})} style={{background:C.bg3,border:`1px solid ${C.bdL}`,borderRadius:7,padding:"5px 9px",cursor:"pointer",fontSize:12,color:C.textS,fontFamily:"inherit"}}>✏️ แก้ไข</button>
                      <DBtn onClick={()=>setConfDelP(p)}>🗑 ลบ</DBtn>
                    </div>
                  </div>
                </Card>
              );
            })}
            {projects.length===0&&<div style={{textAlign:"center",color:C.textM,padding:"24px",fontSize:13}}>ยังไม่มีโปรเจกต์ กด "+ โปรเจกต์ใหม่" เพื่อเพิ่มครับ</div>}
          </div>
        </div>

      </div>
    </div>
  );
}

/* ════════════════════════════════
   ROOT APP
════════════════════════════════ */
function App(){
  const [me,setMe]=useState(()=>{try{return JSON.parse(localStorage.getItem('rz_me')||'null');}catch{return null;}});
  const team=useGunTeam();
  const tasks=useGunSet('tasks');
  const subs=useGunSet('subs');
  const projects=useGunProjects();
  const [view,setView]=useState("chat");
  const [proj,setProj]=useState(null);
  const [notif,setNotif]=useState(null);
  const toast=useCallback((msg,err=false)=>{setNotif({msg,err});setTimeout(()=>setNotif(null),3000);},[]);

  useEffect(()=>{seedIfNeeded();},[]);
  // Auto-select first project
  useEffect(()=>{if(projects.length>0&&!proj)setProj(projects[0].id);},[projects.length]);

  const login=(m)=>{setMe(m);try{localStorage.setItem('rz_me',JSON.stringify(m));}catch{}};
  const logout=()=>{setMe(null);try{localStorage.removeItem('rz_me');}catch{}};

  if(!me)return<LoginScreen team={team} onLogin={login}/>;

  const meD=team.find(m=>m.id===me.id)||me;
  const activeProj=proj||(projects[0]?.id)||"";
  const pa=tasks.filter(t=>t.status!=="done").length;
  const TABS=[{id:"chat",icon:"💬",label:"สนทนา"},{id:"tasks",icon:"📋",label:"สั่งงาน",badge:pa},{id:"submit",icon:"📤",label:"ส่งงาน"},{id:"ai",icon:"🤖",label:"AI"},{id:"team",icon:"👥",label:"ทีม"}];

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh",background:C.bg0,overflow:"hidden"}}>
      <Toast n={notif}/>
      {/* TOP BAR */}
      <div style={{height:52,background:C.bg1,borderBottom:`1px solid ${C.bd}`,display:"flex",alignItems:"center",padding:"0 14px",gap:10,flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:8,paddingRight:10,borderRight:`1px solid ${C.bd}`,flexShrink:0}}>
          <div style={{width:30,height:30,borderRadius:9,background:C.amber,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,color:C.bg0,fontSize:12,boxShadow:"0 4px 10px rgba(245,158,11,.25)"}}>RZ</div>
          <div style={{fontSize:13,fontWeight:700,lineHeight:1}}>TeamHub<span style={{fontSize:9,fontWeight:400,color:C.textM,marginLeft:4}}>v2</span></div>
        </div>
        {/* Project tabs — dynamic */}
        <div style={{display:"flex",gap:4,overflowX:"auto",flex:1,alignItems:"center"}}>
          {projects.map(p=>{
            const pc=tasks.filter(t=>t.project===p.id&&t.status!=="done").length;
            return(
              <button key={p._k||p.id} onClick={()=>setProj(p.id)} style={{padding:"4px 12px",borderRadius:7,border:`1px solid ${activeProj===p.id?p.color+"60":C.bdL}`,background:activeProj===p.id?`${p.color}18`:"transparent",color:activeProj===p.id?p.color:C.textM,fontSize:12,fontWeight:activeProj===p.id?600:400,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap",transition:"all .15s",display:"flex",alignItems:"center",gap:5}}>
                {p.icon} {p.name}{pc>0&&<span style={{background:p.color,color:"#fff",borderRadius:99,padding:"0 5px",fontSize:9.5,fontWeight:700}}>{pc}</span>}
              </button>
            );
          })}
          {/* Quick add project */}
          <button onClick={()=>setView("team")} title="จัดการโปรเจกต์" style={{width:26,height:26,borderRadius:7,border:`1px dashed ${C.bdL}`,background:"transparent",color:C.textM,fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"all .15s"}} onMouseEnter={e=>{e.currentTarget.style.borderColor=C.amber;e.currentTarget.style.color=C.amber;}} onMouseLeave={e=>{e.currentTarget.style.borderColor=C.bdL;e.currentTarget.style.color=C.textM;}}>+</button>
        </div>
        {/* Right: avatars + me */}
        <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
          <div style={{display:"flex"}}>{team.filter(m=>m.active&&!m._d).slice(0,5).map((m,i)=><div key={m.id} title={m.name} style={{width:22,height:22,borderRadius:"50%",background:m.color,border:`2px solid ${C.bg1}`,marginLeft:i?-6:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:7,fontWeight:700,color:"#fff",zIndex:10-i,position:"relative"}}>{m.initials}</div>)}</div>
          <span style={{fontSize:11,color:C.textM}}>{team.filter(m=>m.active&&!m._d).length} คน</span>
          <div style={{width:1,height:16,background:C.bd}}/>
          <div style={{display:"flex",alignItems:"center",gap:6,background:C.amberBg,border:`1px solid ${C.amber}30`,borderRadius:18,padding:"3px 10px 3px 4px",cursor:"pointer"}} onClick={()=>setView("team")}>
            <Av initials={meD.initials} color={meD.color} size={24} dot="on"/>
            <span style={{fontSize:12,fontWeight:600,color:C.amber}}>{meD.name}</span>
          </div>
          <button onClick={logout} title="ออกจากระบบ" style={{background:"transparent",border:`1px solid ${C.bdL}`,borderRadius:7,padding:"5px 8px",cursor:"pointer",fontSize:12,color:C.textM,fontFamily:"inherit"}}>⎋</button>
        </div>
      </div>

      {/* LAYOUT */}
      <div style={{display:"flex",flex:1,overflow:"hidden"}}>
        {/* Sidebar */}
        <div style={{width:54,background:C.bg1,borderRight:`1px solid ${C.bd}`,display:"flex",flexDirection:"column",flexShrink:0}}>
          {TABS.map(tab=>(
            <button key={tab.id} onClick={()=>setView(tab.id)} title={tab.label} style={{width:"100%",padding:"11px 0",border:"none",background:view===tab.id?C.amberBg:"transparent",color:view===tab.id?C.amber:C.textM,cursor:"pointer",fontFamily:"inherit",borderLeft:`3px solid ${view===tab.id?C.amber:"transparent"}`,transition:"all .15s",display:"flex",flexDirection:"column",alignItems:"center",gap:2,position:"relative"}}>
              <span style={{fontSize:18}}>{tab.icon}</span>
              <span style={{fontSize:9,fontWeight:view===tab.id?700:400}}>{tab.label}</span>
              {tab.badge>0&&<div style={{position:"absolute",top:7,right:7,minWidth:15,height:15,borderRadius:99,background:C.amber,color:C.bg0,fontSize:8.5,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",padding:"0 3px"}}>{tab.badge>99?"99+":tab.badge}</div>}
            </button>
          ))}
          <div style={{flex:1}}/>
          <div style={{padding:"8px 0",borderTop:`1px solid ${C.bd}`,textAlign:"center"}}>
            <div style={{width:7,height:7,borderRadius:"50%",background:C.green,margin:"0 auto",animation:"pulse 2s infinite"}} title="Real-time syncing"/>
          </div>
        </div>

        {/* Content */}
        <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
          {view==="chat"  &&<ChatView   proj={activeProj} me={meD} team={team} projects={projects}/>}
          {view==="tasks" &&<TasksView  me={meD} team={team} toast={toast} projects={projects}/>}
          {view==="submit"&&<SubmitView me={meD} team={team} tasks={tasks} toast={toast} projects={projects}/>}
          {view==="ai"    &&<AIView     me={meD}/>}
          {view==="team"  &&<TeamView   team={team} tasks={tasks} subs={subs} toast={toast} projects={projects}/>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
